<section class="todoapp__main" data-cy="TodoList">
  <!-- This is a completed todo -->
  @for (todo of listaTarefas; track todo.id) {
    <div data-cy="Todo" class="todo" [class.completed]="todo.completed">
      <label class="todo__status-label">
        <input
          data-cy="TodoStatus"
          type="checkbox"
          [checked]="todo.completed"
          class="todo__status"
          (click)="marcarTarefa(todo.id)"
          (dbclick)="handleEditing(todo.id)"
        />
      </label>
      <span data-cy="TodoTitle" class="todo__title">
        {{ todo.name }}
      </span>

      @if (isEditing) {
        <form>
          <input
            data-cy="TodoTitleField"
            type="text"
            class="todo__title-field"
            placeholder="Empty todo will be deleted"
            value="{{ todo.name }}"
          />
        </form>
      }
      <button type="button" class="todo__remove" data-cy="TodoDelete">×</button>
    </div>
  }
</section>
