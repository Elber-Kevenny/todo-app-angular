<section class="todoapp__main" data-cy="TodoList">
      <!-- This is a completed todo -->
      @for (todo of listaTarefas; track todo) {
        <div data-cy="Todo" class="todo" [class.completed]='isCompleted'>
        <label class="todo__status-label">
          <input
            data-cy="TodoStatus"
            type="checkbox"
            class="todo__status"
            (click)="marcarTarefa(tarefa.completed)"
          />
        </label>

        <span data-cy="TodoTitle" class="todo__title">
          <form>
            <input
              data-cy="TodoTitleField"
              type="text"
              class="todo__title-field"
              placeholder="Empty todo will be deleted"
              value="{{todo.name}}"
            />
          </form>
        </span>


        <!-- Remove button appears only on hover -->
        <button type="button" class="todo__remove" data-cy="TodoDelete">
          ×
        </button>
      </div>
      <!-- This todo is an active todo -->


      <!-- This todo is being edited -->


      <!-- This todo is in loading state -->

      }

    </section>
